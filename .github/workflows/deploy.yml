# Deploy: runs when something is merged into main.
#   1. "build":      checks and builds once.
#   2. "staging":    deploys that build to https://fling-staging.jeffreydoughty.com
#   3. "production": waits for the owner's approval (set on the "production"
#                    environment in GitHub), then deploys the SAME build to
#                    https://fling.jeffreydoughty.com
name: Deploy

on:
  push:
    branches: [main]

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Save the build so both deploys use the exact same files
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 30

  staging:
    name: staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://fling-staging.jeffreydoughty.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Deploy to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env staging --message "main ${GITHUB_SHA::7}"

  production:
    name: production
    needs: staging
    runs-on: ubuntu-latest
    # This environment requires the owner's approval, so the job pauses here
    # until someone clicks "Approve and deploy" in GitHub.
    environment:
      name: production
      url: https://fling.jeffreydoughty.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env="" --message "main ${GITHUB_SHA::7}"
